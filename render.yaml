services:
  - type: web
    name: fiesta-de-halloween
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
        # Pega aquí el connection string de tu clúster de MongoDB Atlas
        # ya existente (el mismo de tus otros proyectos), con un nombre
        # de base de datos distinto al final de la URL, ej. "/halloween-invite".
